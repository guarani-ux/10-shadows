name: Ten Shadows CI

on:
  push:
    branches: [ master, main, 'release/**', 'feat/**', 'fix/**', 'docs/**' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff Lint
        run: ruff check .

  python-format:
    name: Python Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install Ruff
        run: pip install ruff
      - name: Produce canonical Ruff formatting
        run: ruff format .
      - name: Collect formatted Python snapshot
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ruff-formatted"
          git diff --name-only -- '*.py' > "$RUNNER_TEMP/ruff-formatted/changed.txt"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "$RUNNER_TEMP/ruff-formatted/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/ruff-formatted/$path"
          done < "$RUNNER_TEMP/ruff-formatted/changed.txt"
      - name: Upload formatter result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-python
          path: ${{ runner.temp }}/ruff-formatted
          if-no-files-found: error
      - name: Ruff Format Check
        run: git diff --exit-code -- '*.py'

  rust-quality:
    name: Rust Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Formatting Check
        run: cargo fmt --check
      - name: Rust Static Quality Check
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust-kernel:
    name: Rust Trusted Kernel Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Set up Python for dispatcher integration
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Python runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build Kernel Workspace
        run: cargo build --workspace --all-targets
      - name: Run Rust authority tests
        run: cargo test --workspace -- --nocapture

  test-python-ecosystem:
    name: Python Ecosystem & Epistemic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Configure Git Identity for Test Sandboxes
        run: |
          git config --global user.name "Ten Shadows CI"
          git config --global user.email "ci@ten-shadows.local"
      - name: Execute Deterministic Preflight Health Check
        run: python scripts/preflight.py
      - name: Enforce capability claim discipline
        run: python scripts/check_capability_claims.py
      - name: Execute Full Pytest Suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee "$RUNNER_TEMP/test_out.txt"
      - name: Verify Working Tree Cleanliness Post-Test
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "::error::Working directory is dirty after running test suite! Leaked artifacts:"
            echo "$STATUS"
            exit 1
          fi
      - name: Publish Pytest Summary
        if: always()
        run: |
          echo "## Pytest Output Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f "$RUNNER_TEMP/test_out.txt" ]; then
            tail -n 120 "$RUNNER_TEMP/test_out.txt" >> $GITHUB_STEP_SUMMARY
          else
            echo "Pytest did not produce an output file." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  clean-room:
    name: Fresh Checkout Reconstruction
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install documented dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Configure disposable Git identity
        run: |
          git config --global user.name "Ten Shadows Clean Room"
          git config --global user.email "clean-room@ten-shadows.local"
      - name: Preflight from fresh checkout
        run: python scripts/preflight.py
      - name: Capability claims remain bounded
        run: python scripts/check_capability_claims.py
      - name: Public CLI loads
        run: |
          python ts_run.py --help
          python ts_run.py capabilities list --json
      - name: Narrow deterministic run is non-promoting by default
        shell: bash
        run: |
          TARGET="$RUNNER_TEMP/ten-shadows-clean-room-target"
          mkdir -p "$TARGET"
          python ts_run.py run "Create a Python function that converts Celsius to Fahrenheit and verify it against independently specified examples." --target "$TARGET" --json
          if [ -e "$TARGET/temperature.py" ]; then
            echo "::error::Default run mutated the target without explicit promotion authorization."
            exit 1
          fi

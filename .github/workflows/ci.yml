name: Ten Shadows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Configure Git User for Test Sandboxes
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "bot@ten.shadows"

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee test_out.txt

      - name: Publish Summary
        if: always()
        run: |
          echo "## Pytest Output Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 test_out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

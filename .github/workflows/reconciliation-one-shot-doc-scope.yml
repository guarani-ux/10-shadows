name: Reconciliation One-Shot Document Scope

on:
  push:
    branches: [ 'docs/ground-truth-capability-audit' ]

permissions:
  contents: write

jobs:
  scope-historical-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: docs/ground-truth-capability-audit
      - name: Add evidence-scope banners
        shell: python
        run: |
          from pathlib import Path

          banners = {
              "plan.md": "> **DESIGN / IMPLEMENTATION PLAN — NOT CURRENT CAPABILITY EVIDENCE.** This document describes a Grounded Satisfaction Resolution target architecture and verification plan. Items written as requirements, proposed changes, invariants, or completion criteria must not be read as implemented or verified unless `CAPABILITY_GROUND_TRUTH.md` and current executable evidence independently establish them.\n\n",
              "synthesis_plan.md": "> **LEGACY SOURCE ANALYSIS — NOT TEN SHADOWS CURRENT STATE.** This document summarizes the separate Konoha 0.1.0 system and its lessons. Claims below describe that source material or historical assessment, not present-tense Ten Shadows capability. Current Ten Shadows status is governed by `CAPABILITY_GROUND_TRUTH.md`.\n\n",
              "outer_sanctum_spec.md": "> **LEGACY SOURCE DECOMPOSITION — NOT TEN SHADOWS CURRENT STATE.** This document describes the separate Outer Sanctum codebase as reverse-engineered source material. Its components and claims are not Ten Shadows capabilities unless independently implemented and verified in the current repository. See `CAPABILITY_GROUND_TRUTH.md`.\n\n",
              "outer_sanctum_audit.md": "> **LEGACY EXTERNAL AUDIT — NOT TEN SHADOWS CURRENT STATE.** This document audits a separate local Outer Sanctum codebase and retains its historical conclusions as provenance. It does not certify Ten Shadows or any current repository capability. See `CAPABILITY_GROUND_TRUTH.md` for present-tense status.\n\n",
          }

          for filename, banner in banners.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              if not lines:
                  raise SystemExit(f"empty document: {filename}")
              if banner.strip() in text:
                  continue
              updated = lines[0] + "\n" + banner + "".join(lines[1:])
              path.write_text(updated, encoding="utf-8")
      - name: Commit scoped documents
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No document changes required."
            exit 0
          fi
          git config user.name "Ten Shadows Reconciliation"
          git config user.email "reconciliation@ten-shadows.local"
          git add plan.md synthesis_plan.md outer_sanctum_spec.md outer_sanctum_audit.md
          git commit -m "scope legacy and design documents as non-authoritative"
          git push origin HEAD:docs/ground-truth-capability-audit

name: Reconciliation One-Shot Evidence Patch

on:
  push:
    branches: [ 'docs/ground-truth-capability-audit' ]

permissions:
  contents: write

jobs:
  patch-reconciliation-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: docs/ground-truth-capability-audit
      - name: Apply exact evidence-scope corrections
        shell: python
        run: |
          from pathlib import Path

          orchestrator = Path("loop_engine/orchestrator.py")
          text = orchestrator.read_text(encoding="utf-8")
          old = "                    provider_receipt=worker_result.provider_receipt,\n                )"
          new = "                    provider_receipt=worker_result.provider_receipt,\n                    status=worker_result.exit_status,\n                )"
          if old not in text:
              raise SystemExit("orchestrator patch target not found")
          orchestrator.write_text(text.replace(old, new, 1), encoding="utf-8")

          rust_state = Path("crates/ten_shadows_kernel/src/state_machine.rs")
          text = rust_state.read_text(encoding="utf-8")
          old = "            claim_target_behaviorally_tested: is_verified,"
          new = "            // Verification is performed against the governed candidate workspace before promotion.\n            // No post-promotion target test is currently executed, so this stronger claim stays false.\n            claim_target_behaviorally_tested: false,"
          if old not in text:
              raise SystemExit("Rust claim patch target not found")
          rust_state.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Format patched sources
        run: |
          python -m pip install ruff
          ruff format loop_engine/orchestrator.py
          cargo fmt --all
      - name: Commit patch output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch output."
            exit 0
          fi
          git config user.name "Ten Shadows Reconciliation"
          git config user.email "reconciliation@ten-shadows.local"
          git add -A
          git commit -m "bind worker status and narrow Rust target-test claim"
          git push origin HEAD:docs/ground-truth-capability-audit

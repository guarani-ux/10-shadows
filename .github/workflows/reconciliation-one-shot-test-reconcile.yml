name: Reconciliation One-Shot Test Semantics

on:
  push:
    branches: [ 'docs/ground-truth-capability-audit' ]

permissions:
  contents: write

jobs:
  reconcile-tests:
    if: github.event.head_commit.message == 'add one-shot test reconciliation for corrected semantics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ground-truth-capability-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile stale tests with fail-closed semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_mandatory_execution_authority.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''        assert receipt.final_status == RunStatus.FAILED\n        assert receipt.verification.exit_code != 0\n        assert receipt.verification.tests_failed >= 1\n        assert receipt.epistemic_claims.claim_independently_verified is False\n        assert receipt.epistemic_claims.claim_promoted is False\n''',
              '''        # No builder exists for this compatibility-harness objective, so the\n        # truthful result is a governed BLOCKED run rather than fabricated failure evidence.\n        assert receipt.final_status == RunStatus.BLOCKED\n        assert receipt.verification is None\n        assert receipt.epistemic_claims.claim_independently_verified is False\n        assert receipt.epistemic_claims.claim_promoted is False\n''',
          )
          text = text.replace(
              '''        assert receipt.final_status == RunStatus.VERIFIED_SUCCESS\n        assert receipt.routing_strategy == RoutingStrategy.ADVERSARIAL_AUDIT\n        assert len(receipt.capabilities_selected) == 3\n        assert is_ten_shadows_execution(receipt.run_id, kernel_db=temp_kernel.db) is True\n''',
              '''        # Routing can be proven without pretending that a passing verifier\n        # constitutes successful work when no builder ever executed.\n        assert receipt.final_status == RunStatus.BLOCKED\n        assert receipt.routing_strategy == RoutingStrategy.ADVERSARIAL_AUDIT\n        assert len(receipt.capabilities_selected) == 3\n        assert receipt.epistemic_claims.claim_worker_executed is False\n        assert receipt.epistemic_claims.claim_independently_verified is False\n        assert is_ten_shadows_execution(receipt.run_id, kernel_db=temp_kernel.db) is True\n''',
              1,
          )
          text = text.replace(
              '''            builder_fn=builder_mutator,\n        )\n\n        assert receipt.final_status == RunStatus.VERIFIED_SUCCESS\n''',
              '''            builder_fn=builder_mutator,\n            allow_target_mutation=True,\n        )\n\n        assert receipt.final_status == RunStatus.VERIFIED_SUCCESS\n''',
              1,
          )
          text = text.replace(
              '''        assert receipt.epistemic_claims.claim_promoted is True\n        assert is_ten_shadows_execution(receipt.run_id, kernel_db=temp_kernel.db) is True\n''',
              '''        # This internal compatibility harness mutates the disposable target\n        # directly after explicit authorization; it does not perform a promotion step.\n        assert receipt.epistemic_claims.claim_promoted is False\n        assert receipt.verification_scope == "target"\n        assert is_ten_shadows_execution(receipt.run_id, kernel_db=temp_kernel.db) is True\n''',
              1,
          )
          text = text.replace(
              '''            model_name="gemini-2.5-flash",\n        )\n''',
              '''            model_name="gemini-2.5-flash",\n            allow_target_mutation=True,\n        )\n''',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_worker_dispatcher.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from loop_engine.harness.git_worktree import PROJECT_ROOT, AuthoritativeSourceProtectionError\n',
              'from loop_engine.harness.git_worktree import PROJECT_ROOT\n',
          )
          text = text.replace(
              '    assert "Worker authorization token verification failed" in result.errors[0]\n',
              '    assert "authorization binding digest" in result.errors[0]\n',
          )
          text = text.replace(
              '''    with pytest.raises(AuthoritativeSourceProtectionError):\n        dispatch_worker(auth)\n''',
              '''    result = dispatch_worker(auth)\n    assert result.exit_status == "REJECTED"\n    assert result.completion_status == "REJECTED"\n    assert "Authoritative source protection rejected workspace" in result.errors[0]\n''',
          )
          text = text.replace(
              '    assert "GEMINI_API_KEY not configured in environment." in result.errors[0]\n',
              '    assert "no provider invocation occurred" in result.errors[0]\n',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('loop_engine/tests/test_slice2_gamemaster_hud.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "ZERO-TRUST RUNTIME OS" in rendered\n',
              '    assert "LOCAL TELEMETRY" in rendered\n    assert "CAPABILITY_GROUND_TRUTH.md" in rendered\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and lint changed tests
        run: |
          pip install ruff
          ruff format tests/test_mandatory_execution_authority.py tests/test_worker_dispatcher.py loop_engine/tests/test_slice2_gamemaster_hud.py
          ruff check tests/test_mandatory_execution_authority.py tests/test_worker_dispatcher.py loop_engine/tests/test_slice2_gamemaster_hud.py
      - name: Commit reconciled tests
        run: |
          git config user.name "Ten Shadows Reconciliation"
          git config user.email "reconciliation@ten-shadows.local"
          git add tests/test_mandatory_execution_authority.py tests/test_worker_dispatcher.py loop_engine/tests/test_slice2_gamemaster_hud.py
          git commit -m "align adversarial tests with corrected fail-closed semantics"
          git push origin HEAD:docs/ground-truth-capability-audit

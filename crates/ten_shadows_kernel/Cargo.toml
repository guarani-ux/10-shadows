[package]
name = "ten_shadows_kernel"
version = "3.0.0"
edition = "2021"
authors = ["Ten Shadows Team"]
description = "Mechanically Authoritative Trusted Kernel for 10 SHADOWS"

[[bin]]
name = "ts"
path = "src/main.rs"

[lib]
name = "ten_shadows_kernel"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

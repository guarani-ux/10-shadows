[pytest]
norecursedirs = scratch sandbox .agents .git .venv venv target crates/ten_shadows_kernel/target
testpaths = tests loop_engine/tests svris/tests Forge/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short
markers =
    unit: Isolated unit tests for functions and pure data structures
    integration: Cross-component and boundary integration tests
    adversarial: Adversarial authority, custody, and boundary falsification tests
    property: Invariant and property-based verification tests
    mutation: Mutation and sensitivity analysis tests
    walking_skeleton: Deterministic cross-domain execution walking skeletons
    relational: Graph relational intelligence and truth maintenance tests
    slow: Long-running or resource-intensive tests
